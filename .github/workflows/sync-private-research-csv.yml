name: Sync 21 research CSVs from private source
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: ab21-private-public-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and export sanitized research CSVs
        env:
          AB21_SOURCE_TOKEN: ${{ secrets.AB21_SOURCE_TOKEN }}
          AB21_SOURCE_REF: feature/ab21-dashboard-v2-20261118
        run: python scripts/sync_private_research_csv.py
      - name: Publish changed CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_data/fx_sessions/H1/
          if git diff --cached --quiet; then echo "No source changes"; exit 0; fi
          git commit -m "Sync validated public research-only H1 snapshots"
          git push
