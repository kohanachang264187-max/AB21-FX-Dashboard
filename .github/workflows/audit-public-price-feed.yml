name: Audit public 21-pair price feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_price_feed.py'
      - '.github/workflows/audit-public-price-feed.yml'
      - 'research_data/fx_sessions/H1/**'
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
concurrency:
  group: public-price-feed-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_price_feed.py
      - name: Publish quality report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_quality/price_feed_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update published price feed freshness report"
          git push
